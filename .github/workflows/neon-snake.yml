
name: Neon Predator Snake

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/generate_neon_snake.py'
      - '.github/workflows/neon-snake.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --upgrade Pillow

      - name: Generate custom animation
        env:
          GITHUB_USERNAME: raghav4444
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_neon_snake.py

      - name: Publish GIF without deleting other output files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git clone --depth 1 --branch output \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            output-repo

          cp dist/neon-snake.gif output-repo/

          cd output-repo

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add neon-snake.gif

          if ! git diff --cached --quiet; then
            git commit -m 'Update neon contribution snake'
            git push origin output
          else
            echo 'No changes to publish.'
          fi
