name: Update NeoTerminal dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main, master]
    paths:
      - "scripts/update_dashboard.py"
      - ".github/workflows/update-dashboard.yml"

permissions:
  contents: write

jobs:
  refresh-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate dashboard from GitHub API
        env:
          GITHUB_USERNAME: raghav4444
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_dashboard.py
      - name: Commit refreshed dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dashboard.svg
          if git diff --cached --quiet; then
            echo "Dashboard has no changes."
          else
            git commit -m "chore: refresh live NeoTerminal dashboard"
            git push
          fi
