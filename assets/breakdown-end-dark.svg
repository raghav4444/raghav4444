    <text x="1164" y="274" text-anchor="end" font-size="9" letter-spacing="1.6" fill="#8a8a82">1001–1365 · 2026</text>
  </g>
</g>
<rect x="0.5" y="0.5" width="1199" height="299" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>