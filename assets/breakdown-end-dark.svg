    <text x="600" y="196" font-size="10" fill="#c8a96e">github.com/raghav4444</text>
  </g>
  <g class="rise" style="animation-delay:1.9s" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">
