<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="End card: an on-set lighting reference kit (grey ball, chrome ball reflecting the sunset, colour chart). Thanks for watching. Raghvendra Singh .">
<style>
.boot{animation:fade .7s ease-out both}
.lightOn{animation:fade 1.1s ease-out .45s both}
.envIn{animation:envIn 1.6s cubic-bezier(0.16, 1, 0.3, 1) .5s both}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(0.16, 1, 0.3, 1) both}
.rise{animation:rise .9s cubic-bezier(0.16, 1, 0.3, 1) both}
.pulse{animation-name:pulse;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
.drift{animation-name:drift;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
@keyframes fade{from{opacity:0}}
@keyframes envIn{from{opacity:0;transform:translateX(-40px)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(14px,0)}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
<defs>
  <clipPath id="frame"><rect width="1200" height="300" rx="16"/></clipPath>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="214" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#070707"/><stop offset="1" stop-color="#1a1916"/></linearGradient>
  <linearGradient id="floor" x1="0" y1="214" x2="0" y2="300" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1c1b18"/><stop offset="1" stop-color="#080808"/></linearGradient>
  <radialGradient id="key" cx="300" cy="214" r="420" gradientUnits="userSpaceOnUse" gradientTransform="translate(300 214) scale(1 .45) translate(-300 -214)"><stop offset="0" stop-color="#c8a96e" stop-opacity="0.16"/><stop offset="1" stop-color="#c8a96e" stop-opacity="0"/></radialGradient>
  <radialGradient id="greyLit" cx="34%" cy="30%" r="78%"><stop offset="0" stop-color="#c7c5c0"/><stop offset=".5" stop-color="#76746f"/><stop offset="1" stop-color="#2c2b29"/></radialGradient>
  <radialGradient id="rimFill" cx="80%" cy="62%" r="40%"><stop offset="0" stop-color="#4a9eff" stop-opacity=".22"/><stop offset="1" stop-color="#4a9eff" stop-opacity="0"/></radialGradient>
  <linearGradient id="ballSky" x1="0" y1="74" x2="0" y2="126" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#05060a"/><stop offset="0.3" stop-color="#0d1220"/><stop offset="0.55" stop-color="#2a2433"/><stop offset="0.8" stop-color="#7a5634"/><stop offset="1" stop-color="#e2b46e"/></linearGradient>
  <linearGradient id="ballGround" x1="0" y1="124" x2="0" y2="162" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#c99a5e"/><stop offset=".3" stop-color="#3a2c22"/><stop offset="1" stop-color="#000000"/></linearGradient>
  <radialGradient id="chromeEdge"><stop offset=".62" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.75"/></radialGradient>
  <radialGradient id="shadow"><stop offset="0" stop-color="#000000" stop-opacity="0.7"/><stop offset="1" stop-color="#000000" stop-opacity="0"/></radialGradient>
  <clipPath id="chrome"><circle cx="268" cy="118" r="44"/></clipPath>
</defs>
<g clip-path="url(#frame)">
  <rect width="1200" height="214" fill="url(#wall)"/>
  <rect y="214" width="1200" height="86" fill="url(#floor)"/>
  <ellipse class="lightOn" cx="300" cy="214" rx="420" ry="190" fill="url(#key)"/>
  <!-- the ball rig: one stand, a crossbar, a ball on each end -->
  <g class="boot">
    <ellipse cx="212" cy="264" rx="64" ry="7" fill="url(#shadow)"/>
    <path d="M212 262V184M156 184H268M156 184V162M268 184V162M196 264l16 -10l16 10" fill="none" stroke="#3a3936" stroke-width="3" stroke-linecap="round"/>
    <circle cx="156" cy="118" r="44" fill="#1d1d1c"/>
    <circle cx="268" cy="118" r="44" fill="#111111"/>
  </g>
  <g class="lightOn">
    <circle cx="156" cy="118" r="44" fill="url(#greyLit)"/>
    <circle cx="156" cy="118" r="44" fill="url(#rimFill)"/>
  </g>
  <g clip-path="url(#chrome)"><g class="envIn"><g class="drift" style="animation-duration:16s">
<rect x="198" y="74" width="140" height="50" fill="url(#ballSky)"/>
<path d="M198 124Q268 140 338 124V162H198Z" fill="url(#ballGround)"/>
<path d="M238 130.5h2.2v-3.4h-2.2zM240.8 130.8h2.2v-3.8h-2.2zM243.6 131h2.2v-3.8h-2.2zM246.4 131.2h2.2v-4.9h-2.2zM249.2 131.4h2.2v-5h-2.2zM252 131.6h2.2v-4.1h-2.2zM254.8 131.7h2.2v-3.2h-2.2zM257.6 131.8h2.2v-3.4h-2.2zM260.4 131.9h2.2v-4.8h-2.2zM263.2 132h2.2v-2.9h-2.2zM266 132h2.2v-3.3h-2.2zM268.8 132h2.2v-5.2h-2.2zM271.6 132h2.2v-3h-2.2zM274.4 131.9h2.2v-5.8h-2.2zM277.2 131.9h2.2v-7.5h-2.2zM280 131.8h2.2v-5.5h-2.2zM282.8 131.6h2.2v-6.4h-2.2zM285.6 131.5h2.2v-3.6h-2.2zM288.4 131.3h2.2v-4.3h-2.2zM291.2 131.1h2.2v-3.6h-2.2zM294 130.9h2.2v-3.5h-2.2zM296.8 130.6h2.2v-3.1h-2.2z" fill="#0d0e11"/>
<ellipse cx="262" cy="125" rx="9" ry="3" fill="#fff1cf"/>
<ellipse cx="262" cy="125" rx="40" ry=".9" fill="#4a9eff" opacity=".8"/>
</g></g>
    <circle cx="268" cy="118" r="44" fill="url(#chromeEdge)"/>
    <ellipse class="lightOn" cx="253" cy="97" rx="7" ry="4.5" fill="#ffffff" opacity=".9" transform="rotate(-30 253 97)"/>
  </g>
  <circle cx="268" cy="118" r="43.5" fill="none" stroke="#ffffff" stroke-opacity="0.18"/>
  <!-- the colour chart, standing on the floor -->
  <g class="boot">
    <ellipse cx="466" cy="264" rx="96" ry="6" fill="url(#shadow)"/>
    <path d="M412 208L404 262M520 208L528 262" stroke="#3a3936" stroke-width="3" stroke-linecap="round"/>
    <rect x="382" y="92" width="168" height="116" rx="4" fill="#151515"/>
  </g>
  <rect class="pop" style="animation-delay:0.7s" x="390" y="100" width="22" height="22" rx="1.5" fill="#735244"/><rect class="pop" style="animation-delay:0.735s" x="416" y="100" width="22" height="22" rx="1.5" fill="#c29682"/><rect class="pop" style="animation-delay:0.77s" x="442" y="100" width="22" height="22" rx="1.5" fill="#627a9d"/><rect class="pop" style="animation-delay:0.805s" x="468" y="100" width="22" height="22" rx="1.5" fill="#576c43"/><rect class="pop" style="animation-delay:0.84s" x="494" y="100" width="22" height="22" rx="1.5" fill="#8580b1"/><rect class="pop" style="animation-delay:0.875s" x="520" y="100" width="22" height="22" rx="1.5" fill="#67bdaa"/><rect class="pop" style="animation-delay:0.91s" x="390" y="126" width="22" height="22" rx="1.5" fill="#d67e2c"/><rect class="pop" style="animation-delay:0.945s" x="416" y="126" width="22" height="22" rx="1.5" fill="#505ba6"/><rect class="pop" style="animation-delay:0.98s" x="442" y="126" width="22" height="22" rx="1.5" fill="#c15a63"/><rect class="pop" style="animation-delay:1.015s" x="468" y="126" width="22" height="22" rx="1.5" fill="#5e3c6c"/><rect class="pop" style="animation-delay:1.05s" x="494" y="126" width="22" height="22" rx="1.5" fill="#9dbc40"/><rect class="pop" style="animation-delay:1.085s" x="520" y="126" width="22" height="22" rx="1.5" fill="#e0a32e"/><rect class="pop" style="animation-delay:1.12s" x="390" y="152" width="22" height="22" rx="1.5" fill="#383d96"/><rect class="pop" style="animation-delay:1.155s" x="416" y="152" width="22" height="22" rx="1.5" fill="#469449"/><rect class="pop" style="animation-delay:1.19s" x="442" y="152" width="22" height="22" rx="1.5" fill="#af363c"/><rect class="pop" style="animation-delay:1.225s" x="468" y="152" width="22" height="22" rx="1.5" fill="#e7c71f"/><rect class="pop" style="animation-delay:1.26s" x="494" y="152" width="22" height="22" rx="1.5" fill="#bb5695"/><rect class="pop" style="animation-delay:1.295s" x="520" y="152" width="22" height="22" rx="1.5" fill="#0885a1"/><rect class="pop" style="animation-delay:1.33s" x="390" y="178" width="22" height="22" rx="1.5" fill="#f3f3f2"/><rect class="pop" style="animation-delay:1.365s" x="416" y="178" width="22" height="22" rx="1.5" fill="#c8c8c8"/><rect class="pop" style="animation-delay:1.4s" x="442" y="178" width="22" height="22" rx="1.5" fill="#a0a0a0"/><rect class="pop" style="animation-delay:1.435s" x="468" y="178" width="22" height="22" rx="1.5" fill="#7a7a79"/><rect class="pop" style="animation-delay:1.47s" x="494" y="178" width="22" height="22" rx="1.5" fill="#555555"/><rect class="pop" style="animation-delay:1.505s" x="520" y="178" width="22" height="22" rx="1.5" fill="#343434"/>
  <g class="boot" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="8.5" letter-spacing="1.6" fill="#8a8a82" text-anchor="middle">
    <text x="156" y="288">18% GREY</text>
    <text x="268" y="288">CHROME</text>
    <text x="466" y="288">COLOUR REFERENCE</text>
  </g>
  <!-- sign-off -->
  <g font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif" font-size="40" font-style="italic" fill="#f0ede8">
    <text class="rise" style="animation-delay:1.2s" x="600" y="124">Thanks for watching.</text>
  </g>
  <g class="rise" style="animation-delay:1.55s" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="2">
